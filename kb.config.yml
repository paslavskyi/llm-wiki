# Knowledge base runtime config. Read first in every session.
mode: debug          # debug | autonomous
language: uk
owner: ""           # your name

persistence:
  autocommit: manual     # off | manual | auto
  threshold: 10          # uncommitted knowledge files → action
  max_age_hours: 24      # age of oldest uncommitted change → action
  remind_every_hours: 4  # manual: debounce reminders (anti-noise)
  hard_safety_net: false # optional technical auto-commit fallback
  hard_threshold: 50     # (if hard_safety_net) higher volume threshold

session:
  budget_bytes: 1500     # SessionStart snapshot size cap (bytes)

health:
  duplicates:
    enabled: false       # flag likely-duplicate notes in index/health.md (can be noisy)
    threshold: 0.92      # title similarity (Jaro-Winkler) to count as a duplicate

# decisions:
#   # For a KB that already had a prose decision log before adopting MADR:
#   # accepted decisions created before this date skip the required-sections gate
#   # (Context / Decision / Consequences) and are listed in index/health.md as
#   # "Decisions predating MADR" instead. Quote the date.
#   madr_required_since: "2026-01-01"
